<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420">
  <!-- Indoor court floor, salmon-red with subtle banding -->
  <rect x="0" y="0" width="300" height="420" fill="#FF8A75"/>
  <rect x="0" y="0" width="300" height="70" fill="#FF9C8A"/>
  <rect x="0" y="140" width="300" height="70" fill="#FF9C8A"/>
  <rect x="0" y="280" width="300" height="70" fill="#FF9C8A"/>

  <!-- Court boundary: touchlines, goal line (bottom), halfway line (top) -->
  <rect x="8" y="10" width="284" height="400" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>

  <!-- Center circle (bulging down from the halfway line) + center spot -->
  <path d="M 85 10 A 65 65 0 0 1 215 10" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
  <circle cx="150" cy="10" r="3" fill="#FFFFFF"/>

  <!-- Futsal goal area: quarter-circle arcs from each post joined by a
       straight line (the characteristic flattened "D" shape) -->
  <path d="M 64 410 A 70 70 0 0 1 134 340 L 166 340 A 70 70 0 0 1 236 410"
        fill="none" stroke="#FFFFFF" stroke-width="2.5"/>

  <!-- Penalty spot (near) + second penalty spot (far) -->
  <circle cx="150" cy="380" r="3" fill="#FFFFFF"/>
  <circle cx="150" cy="330" r="3" fill="#FFFFFF"/>

  <!-- Second-penalty restart arc (dashed) -->
  <path d="M 100 396 A 60 60 0 0 1 200 396"
        fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-dasharray="6 6"/>

  <!-- Goal frame -->
  <rect x="134" y="410" width="32" height="12" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>

  <!-- Corner arcs -->
  <path d="M 16 410 A 8 8 0 0 0 8 402" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
  <path d="M 284 410 A 8 8 0 0 1 292 402" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
</svg>
