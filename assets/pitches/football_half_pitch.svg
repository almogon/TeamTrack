<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420">
  <!-- Turf, with subtle mowing stripes -->
  <rect x="0" y="0" width="300" height="420" fill="#2E7D32"/>
  <rect x="0" y="0" width="300" height="70" fill="#33872F"/>
  <rect x="0" y="140" width="300" height="70" fill="#33872F"/>
  <rect x="0" y="280" width="300" height="70" fill="#33872F"/>

  <!-- Pitch boundary: touchlines, goal line (bottom), halfway line (top) -->
  <rect x="20" y="10" width="260" height="400" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>

  <!-- Center circle (bulging down from the halfway line) + center spot -->
  <path d="M 85 10 A 65 65 0 0 1 215 10" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
  <circle cx="150" cy="10" r="3" fill="#FFFFFF"/>

  <!-- Penalty box -->
  <path d="M 70 410 L 70 300 L 230 300 L 230 410" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
  <!-- Six-yard box -->
  <path d="M 110 410 L 110 370 L 190 370 L 190 410" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
  <!-- Penalty spot + arc -->
  <circle cx="150" cy="350" r="3" fill="#FFFFFF"/>
  <path d="M 127.1 300 A 55 55 0 0 1 172.9 300" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>

  <!-- Goal frame -->
  <rect x="134" y="410" width="32" height="12" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>

  <!-- Corner arcs -->
  <path d="M 28 410 A 8 8 0 0 0 20 402" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
  <path d="M 272 410 A 8 8 0 0 1 280 402" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
</svg>
